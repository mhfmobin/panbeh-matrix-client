<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تست منوی پیام — پنبه</title>
    <style>
      html, body, #root { height: 100%; }
      .preview { max-width: 760px; height: 100%; margin: auto; display: flex; flex-direction: column; background: var(--panel); }
      .preview-head { padding: 16px 20px; border-bottom: 1px solid var(--border); }
      .preview-head h1 { font-size: 18px; margin: 0 0 8px; }
      .preview-head p { margin: 6px 0; color: var(--muted); font-size: 13px; }
      .preview-controls { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 10px; }
      .preview-controls button { border-radius: 10px; padding: 8px 12px; background: var(--hover); }
      .preview-chat { flex: 1; min-height: 0; overflow-y: auto; padding: 28px 0; background: var(--chat-bg); }
      .preview-status { padding: 12px 20px; min-height: 48px; font-size: 13px; border-top: 1px solid var(--border); }
      .preview-results { padding: 0 20px 12px; font-size: 13px; margin: 0; list-style: none; }
      .preview-results li { padding-top: 6px; }
    </style>
  </head>
  <body><div id="root"></div><script type="module" src="./preview.tsx"></script></body>
</html>
