# GitLab twin of .github/workflows/{android,desktop}.yml.
# CI/CD variables: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# (same as the GitHub secrets; see ANDROID.md). Artifacts carry installers only: no latest*.yml, no blockmaps.

stages: [build, release]

default:
  tags: [panbeh] # only the panbeh runner picks these jobs up

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH || $CI_COMMIT_TAG

variables:
  # tag builds are "v1.2.3", everything else 0.1.0-<pipeline>
  VERSION: $CI_COMMIT_TAG
  # Panbeh-windows-setup.exe -> Panbeh-windows-setup-v1.2.3.exe (tags only)
  RENAME: |
    if [ -n "$CI_COMMIT_TAG" ]; then
      for f in release/Panbeh-*; do
        case "$f" in *.exe|*.dmg|*.zip|*.AppImage|*.deb) mv "$f" "${f%.*}-$CI_COMMIT_TAG.${f##*.}" ;; esac
      done
    fi

.node:
  before_script:
    - if [ -z "$CI_COMMIT_TAG" ]; then export VERSION="0.1.0-$CI_PIPELINE_IID"; fi
  cache:
    key: npm
    paths: [.npm/]

apk:
  extends: .node
  stage: build
  image: node:22-trixie
  script:
    - apt-get update -qq && apt-get install -y -qq openjdk-21-jdk-headless unzip curl >/dev/null
    - export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac))))
    - export ANDROID_HOME=$HOME/android-sdk
    - mkdir -p $ANDROID_HOME/cmdline-tools
    - curl -fsSL -o /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
    - unzip -q /tmp/tools.zip -d $ANDROID_HOME/cmdline-tools && mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
    - yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null
    - $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null
    - npm ci --cache .npm --prefer-offline
    - npm test
    - npm run build
    - npx cap sync android
    - |
      if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
        if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] || [ -n "$CI_COMMIT_TAG" ]; then
          echo "ANDROID_KEYSTORE_BASE64 is not set. Without it the APK is signed with a throwaway debug key and can't update an installed app. See ANDROID.md."
          exit 1
        fi
      else
        echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.jks
        export ANDROID_KEYSTORE_FILE=/tmp/release.jks
      fi
    - cd android && chmod +x gradlew
    - VERSION_CODE=$CI_PIPELINE_IID VERSION_NAME=$VERSION ./gradlew --no-daemon assembleRelease
    - cd ..
    - if [ -n "$CI_COMMIT_TAG" ]; then OUT="Panbeh-$CI_COMMIT_TAG.apk"; else OUT=Panbeh.apk; fi
    - mv android/app/build/outputs/apk/release/app-release.apk "$OUT"
  after_script:
    # the runner keeps the workspace between jobs: drop the keystore and everything built (Panbeh*.apk stays, it's the artifact)
    - rm -rf /tmp/release.jks node_modules dist .npm android/build android/app/build android/.gradle ~/android-sdk ~/.gradle
  artifacts:
    paths: [Panbeh*.apk]

.desktop:
  extends: .node
  stage: build
  script:
    - npm ci --cache .npm --prefer-offline
    - npm test
    - npm run build
    - npx electron-builder $TARGET --publish never -c.extraMetadata.version="${VERSION#v}" $BUILDER_ARGS
    - eval "$RENAME"
  after_script:
    - rm -rf node_modules dist .npm release/*-unpacked release/mac-* release/*.yml release/*.blockmap ~/.cache/electron ~/.cache/electron-builder

desktop-linux:
  extends: .desktop
  image: electronuserland/builder:wine
  variables:
    TARGET: --linux
  artifacts:
    paths:
      - release/Panbeh-*.AppImage
      - release/Panbeh-*.deb

desktop-windows:
  extends: .desktop
  image: electronuserland/builder:wine # builds the Windows installer through wine
  variables:
    TARGET: --win
  artifacts:
    paths:
      - release/Panbeh-*.exe


# macOS disabled: uncomment this job, the `desktop-mac` need and the macOS link in `release` to build it again.
# desktop-mac:
#   extends: .desktop
#   allow_failure: true
#   variables:
#     TARGET: --mac
#     # ad-hoc signature: Apple Silicon refuses to run arm64 code without one
#     BUILDER_ARGS: -c.mac.identity=-
#     CSC_IDENTITY_AUTO_DISCOVERY: "false"
#   artifacts:
#     paths:
#       - release/Panbeh-*.dmg
#       - release/Panbeh-*.zip

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - apk
    - desktop-linux
    - desktop-windows
    # - job: desktop-mac
    #   optional: true
  script: echo "Releasing $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: Panbeh $CI_COMMIT_TAG
    assets:
      links:
        - name: Android APK
          url: $CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/download?job=apk
        - name: Linux installers
          url: $CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/download?job=desktop-linux
        - name: Windows installer
          url: $CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/download?job=desktop-windows
        # - name: macOS installer
        #   url: $CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/download?job=desktop-mac
