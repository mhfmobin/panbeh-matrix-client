name: Flutter Android APK

on:
  push:
    branches: ["**"]
    tags: ["flutter-v*"]
    paths: ["flutter/**", ".github/workflows/flutter-android.yml"]
  workflow_dispatch:

permissions:
  contents: write # attach the APKs to a release on flutter-v* tags

defaults:
  run:
    working-directory: flutter

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      # flutter_vodozemac builds its Rust library from source (cargokit)
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Check
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Require signing key on main and tags
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/flutter-v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Without it the APK is signed with a throwaway debug key and can't update an installed app."
            exit 1
          fi

      # the same key as the Capacitor app, so switching the package id later updates it in place
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/flutter-v') && github.ref_name || format('0.1.0-{0}', github.run_number) }}
        run: |
          flutter build apk --release --split-per-abi
          # tags carry the version; branch builds keep fixed names so the rolling release replaces its assets
          v=""; case "$GITHUB_REF" in refs/tags/flutter-v*) v="-${GITHUB_REF_NAME#flutter-v}";; esac
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=${f#*app-}; abi=${abi%-release.apk}
            mv "$f" "$GITHUB_WORKSPACE/Panbeh-flutter$v-$abi.apk"
          done

      - uses: actions/upload-artifact@v7
        with:
          path: Panbeh-flutter-*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/flutter-v')
        uses: softprops/action-gh-release@v2
        with:
          files: Panbeh-flutter-*.apk

      # rolling pre-release: always the newest main build
      - name: Move flutter-latest tag
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f flutter-latest
          git push -f origin flutter-latest

      - name: Rolling release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-latest
          name: Panbeh Flutter (latest build)
          prerelease: true
          make_latest: false
          files: Panbeh-flutter-*.apk
          body: |
            Latest Flutter build of `main`: ${{ github.sha }}
            Version: 0.1.0-${{ github.run_number }}
