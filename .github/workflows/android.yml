name: Android APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # attach the APK to a release on v* tags

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build web app
        run: |
          npm ci
          npm test
          npm run build
          npx cap sync android

      - name: Require signing key on main and tags
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Without it the APK is signed with a throwaway debug key and can't update an installed app. See ANDROID.md."
            exit 1
          fi

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.0-{0}', github.run_number) }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Panbeh.apk"

      - name: Version the APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: mv Panbeh.apk "Panbeh-$GITHUB_REF_NAME.apk"

      - uses: actions/upload-artifact@v7
        with:
          path: Panbeh*.apk
          archive: false # the artifact is the raw Panbeh.apk, not a zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Panbeh-*.apk

      # rolling pre-release: always the newest main build. Pushing the tag doesn't retrigger this workflow (tags filter is v* only)
      - name: Move latest tag
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Rolling release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Panbeh (latest build)
          prerelease: true
          make_latest: false
          files: Panbeh.apk # same-named asset is replaced (overwrite_files defaults to true)
          body: |
            Latest build of `main`: ${{ github.sha }}
            Version: 0.1.0-${{ github.run_number }}
