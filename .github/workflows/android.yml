name: Android APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual builds: Actions → Android APK → Run workflow, pick the branch

permissions:
  contents: write # attach the APK to a release on v* tags

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # a failed Bazaar build doesn't hold up the GitHub release
      matrix:
        # bazaar: the Cafe Bazaar upload, tags only. An artifact to upload by hand, never in the release (see ANDROID.md)
        store: ${{ startsWith(github.ref, 'refs/tags/v') && fromJSON('["github","bazaar"]') || fromJSON('["github"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build web app
        env:
          VITE_APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.0-{0}', github.run_number) }}
          VITE_STORE: ${{ matrix.store }}
        run: |
          npm ci
          npm test
          npm run build
          npx cap sync android

      # Bazaar doesn't allow apps that install their own updates
      - name: No self-update permission
        if: matrix.store == 'bazaar'
        run: sed -i '/REQUEST_INSTALL_PACKAGES/d' android/app/src/main/AndroidManifest.xml

      - name: Require signing key on tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Without it the APK is signed with a throwaway debug key and can't update an installed app. See ANDROID.md."
            exit 1
          fi

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.0-{0}', github.run_number) }}
        # GitHub builds' versionCode is a million up, so Bazaar (run_number) never counts itself newer and never updates them
        run: |
          export VERSION_CODE=$((GITHUB_RUN_NUMBER + ${{ matrix.store == 'github' && 1000000 || 0 }}))
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Panbeh.apk"

      - name: Check the Bazaar APK can't self-update
        if: matrix.store == 'bazaar'
        run: |
          if "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2" dump permissions Panbeh.apk | grep REQUEST_INSTALL_PACKAGES; then
            echo "::error::the Bazaar APK still asks for REQUEST_INSTALL_PACKAGES"
            exit 1
          fi

      - name: Version the APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: mv Panbeh.apk "Panbeh${{ matrix.store == 'bazaar' && '-bazaar' || '' }}-$GITHUB_REF_NAME.apk"

      - uses: actions/upload-artifact@v7
        with:
          path: Panbeh*.apk
          archive: false # the artifact is the raw Panbeh.apk, not a zip

      # src/releaseNotes.json, Persian then English; this workflow only (the desktop one has no checkout and keeps the body)
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v') && matrix.store == 'github'
        run: jq -r --arg v "${GITHUB_REF_NAME#v}" '.[$v] // empty | [.fa, .en] | map(map("- " + .) | join("\n")) | join("\n\n")' src/releaseNotes.json > release.md

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.store == 'github'
        uses: softprops/action-gh-release@v2
        with:
          files: Panbeh-*.apk
          body_path: release.md

