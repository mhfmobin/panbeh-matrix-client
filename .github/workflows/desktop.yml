name: Desktop apps

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # attach the installers to releases

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          # macOS disabled: uncomment to build it again (and the .dmg line in the rolling release below)
          # - os: macos-latest
          #   target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build web app
        env:
          VITE_APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.0-{0}', github.run_number) }}
        run: |
          npm ci
          npm test
          npm run build

      # Windows: Azure Trusted Signing (see docs/desktop-signing.md). The .pfx path below is the fallback.
      # Signing is required on main and v* tags; a feature branch without secrets just builds unsigned.
      - name: Require Windows signing on main and tags
        if: runner.os == 'Windows' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        run: |
          if [ -z "$AZURE_SIGN_ENDPOINT" ] && [ -z "$WIN_CSC_LINK" ]; then
            echo "::error::Neither AZURE_SIGN_ENDPOINT nor WIN_CSC_LINK is set. Unsigned installers can't update installed apps and SmartScreen blocks them. See docs/desktop-signing.md."
            exit 1
          fi

      - name: Signing keys
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_SIGN_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_SIGN_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_SIGN_CLIENT_SECRET }}
        run: |
          put() { if [ -n "${!1}" ]; then echo "$1=${!1}" >> "$GITHUB_ENV"; fi; }
          if [ "$RUNNER_OS" = macOS ]; then
            if [ -n "$CSC_LINK" ]; then
              for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do put $v; done
            else
              # ad-hoc signature: Apple Silicon refuses to run arm64 code without one
              echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
              echo "BUILDER_ARGS=-c.mac.identity=-" >> "$GITHUB_ENV"
            fi
          elif [ "$RUNNER_OS" = Windows ]; then
            # Azure Trusted Signing auth, exported for the Package step below.
            # Without it: the .pfx fallback, or unsigned (feature branches without secrets).
            if [ -n "$AZURE_SIGN_ENDPOINT" ]; then
              for v in AZURE_SIGN_ENDPOINT AZURE_SIGN_ACCOUNT AZURE_SIGN_PROFILE AZURE_TENANT_ID \
                       AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do put $v; done
            else
              put WIN_CSC_LINK; put WIN_CSC_KEY_PASSWORD
              [ -n "$WIN_CSC_LINK" ] || echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            fi
          fi

      - name: Package
        shell: bash
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.0-{0}', github.run_number) }}
        run: |
          flags=(${{ matrix.target }} --publish never -c.extraMetadata.version="${VERSION#v}" $BUILDER_ARGS)
          if [ "$RUNNER_OS" = Windows ] && [ -n "$AZURE_SIGN_ENDPOINT" ]; then
            # Azure Trusted Signing (docs/desktop-signing.md); takes precedence over CSC_LINK
            flags+=(-c.win.azureSignOptions.endpoint="$AZURE_SIGN_ENDPOINT"
                    -c.win.azureSignOptions.codeSigningAccountName="$AZURE_SIGN_ACCOUNT"
                    -c.win.azureSignOptions.certificateProfileName="$AZURE_SIGN_PROFILE"
                    -c.win.azureSignOptions.publisherName="Panbeh")
          fi
          npx electron-builder "${flags[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: panbeh-${{ runner.os }}
          path: |
            release/Panbeh-*
            release/latest*.yml

  # one job uploads everything, so the three builds don't race to create the release
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true

      # the auto-update channel: latest*.yml and the blockmaps must sit next to the installers
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*

      # rolling pre-release shared with the APK (android.yml moves the tag). The update metadata stays out:
      # installed apps only follow v* releases.
      - name: Rolling release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Panbeh (latest build)
          prerelease: true
          make_latest: false
          files: |
            out/Panbeh-windows-setup.exe
            # out/Panbeh-mac.dmg
            out/Panbeh-linux-*.AppImage
            out/Panbeh-linux-*.deb
