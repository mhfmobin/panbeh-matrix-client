ktor = "3.5.2"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.0"
lifecycle = "2.11.0"
navigation = "2.10.1"
room = "2.8.5"
ksp = "2.3.12"
coil = "3.3.0"
media3 = "1.11.1"
camerax = "1.5.1"
zxing = "3.5.3"
livekit = "2.29.0"
biometric = "1.1.0"
datastore = "1.2.0"
browser = "1.9.0"
junit = "4.13.2"

[libraries]
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
trixnity-client = { module = "de.connect2x.trixnity:trixnity-client", version.ref = "trixnity" }
trixnity-vodozemac = { module = "de.connect2x.trixnity:trixnity-client-cryptodriver-vodozemac", version.ref = "trixnity" }
trixnity-repository-room = { module = "de.connect2x.trixnity:trixnity-client-repository-room", version.ref = "trixnity" }
